{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth">

    <h1>
        Welcome back
    </h1>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="post"
        action="/login"
    >

        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <button
            class="btn"
            type="submit"
        >
            Login
        </button>

    </form>


    <p>

        New here?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>

{% endblock %}
