<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<nav class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    <div>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

            <a href="/logout">
                Logout
            </a>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="btn small"
                href="/register"
            >
                Register
            </a>

        {% endif %}

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    © 2026 PocketSmart AI ·
    AI-generated estimates should be
    verified before purchase.

</footer>


<script src="/static/js/app.js"></script>

</body>

</html>
